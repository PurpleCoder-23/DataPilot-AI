
[project]
name = "data-agent"
version = "0.1.0"
description = "An AI-powered data agent for SQL analysis and ETL workflows."
readme = "README.md"
authors = [
    { name = "PurpleCoder" }
]
requires-python = ">=3.12"

dependencies = [
    "python-dotenv",
    "ipython>=9.17.1",
    "langchain>=1.4.6",
    "langchain-groq>=1.1.3",
    "langgraph>=1.2.16",
    "pandas>=3.1.0",
    "pydantic>=2.14.1",
    "pyodbc>=5.3.0",
    "streamlit>=1.67.0",
    "plotly>=7.1.0",
    "openpyxl>=3.1.5",
]

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
