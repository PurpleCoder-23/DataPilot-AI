[project]
name = "data-agent"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "PurpleCoder", email = "126791739+PurpleCoder-23@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "dotenv>=0.9.9",
    "ipython>=9.17.1",
    "langchain>=1.4.6",
    "langchain-groq>=1.1.3",
    "langgraph>=1.2.16",
    "pandas>=3.1.0",
    "pydantic>=2.14.1",
    "pyodbc>=5.3.0",
]

[project.scripts]
data-agent = "data_agent:main"

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"
